# ===========================================================================
# Calibre-Web for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : linuxserver/calibre-web:0.6.27-ls409 (Docker Hub, used unmodified)
#                  -> https://github.com/janeczku/calibre-web
#
# Ports   : host 8012 -> container 8083. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/calibrewebdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image starts s6-overlay as root and switches to its internal
#           "abc" user; TOS forbids root containers, so this entrypoint bypasses s6 and
#           starts Calibre-Web directly as uid 1000, moving its cache and log into the
#           mounted /config volume.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  calibrewebdocker:
    image: linuxserver/calibre-web:0.6.27-ls409
    container_name: calibrewebdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8012:8083"
    environment:
      TZ: "Asia/Shanghai"
      CALIBRE_DBPATH: "/config"
      CACHE_DIRECTORY: "/config/cache"
      HOME: "/config"
    volumes:
      - /Volume1/DockerAppData/calibrewebdocker/config:/config
      - /Volume1/DockerAppData/calibrewebdocker/books:/books
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8012
    protocol: http
